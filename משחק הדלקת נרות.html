<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#ffc13b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק הדלקת נרות לחנוכה</title>
    <style>
        :root {
            --main-blue: #1e3d59;
            --accent-gold: #ffc13b;
        }

        body {
            direction: rtl;
            background: linear-gradient(135deg, var(--main-blue), #2a5484);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
            font-size: 18px;
            overflow-x: hidden;
        }

        h1 {
            position: relative;
            font-size: 48px;
            color: var(--accent-gold);
            text-align: center;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #ffc13b, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 10px 20px;
            border-radius: 15px;
            transform: skew(-5deg);
            display: inline-block;
            margin-bottom: 10px;
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 24px;
            color: rgba(255,255,255,0.9);
            margin: 5px 0 10px;
            text-align: center;
        }

        .score {
            font-size: 32px;
            margin: 10px;
            color: var(--accent-gold);
        }

        /* חנוכיה */
        .menorah {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            transition: all 0.5s ease;
        }

        .candles-row {
            display: flex;
            align-items: flex-end;
            gap: 14px;
            padding: 0 10px;
        }

        .candle-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            padding: 12px 4px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            position: relative;
            transition: transform 0.15s ease;
        }

        .candle-slot:active {
            transform: scale(0.93);
        }

        .candle-slot.lit {
            cursor: default;
        }

        .flame {
            width: 26px;
            height: 42px;
            background: radial-gradient(circle at 50% 72%, #fff7ae 0%, #ffd23b 45%, #ff8c1a 80%, #ff5e00 100%);
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            opacity: 0;
            transform: scale(0);
            transform-origin: bottom center;
            margin-bottom: -6px;
            z-index: 2;
            box-shadow: 0 0 18px 6px rgba(255, 190, 60, 0.55);
        }

        .candle-slot.lit .flame {
            opacity: 1;
            animation: flame-pop 0.45s ease forwards, flicker 0.9s 0.45s ease-in-out infinite;
        }

        @keyframes flame-pop {
            0% { transform: scale(0); }
            60% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }

        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.08, 1.15) rotate(2deg); }
        }

        .wick {
            width: 4px;
            height: 12px;
            background: #4a3728;
            border-radius: 2px;
            z-index: 1;
        }

        .candle {
            width: 54px;
            height: 150px;
            border-radius: 12px 12px 6px 6px;
            background: linear-gradient(90deg, rgba(255,255,255,0.35) 0%, var(--candle-color) 30%, var(--candle-color) 70%, rgba(0,0,0,0.15) 100%);
            box-shadow: 0 6px 12px rgba(0,0,0,0.35);
            transition: box-shadow 0.3s ease;
        }

        .candle-slot.lit .candle {
            box-shadow: 0 0 22px 4px rgba(255, 210, 90, 0.5);
        }

        .candle-slot.shamash .candle {
            height: 195px;
        }

        .spark {
            position: absolute;
            top: -10px;
            right: 50%;
            transform: translateX(50%);
            font-size: 30px;
            pointer-events: none;
            animation: spark-float 1s ease-out forwards;
            z-index: 3;
        }

        @keyframes spark-float {
            0% { opacity: 1; transform: translateX(50%) translateY(0) scale(0.6); }
            100% { opacity: 0; transform: translateX(50%) translateY(-60px) scale(1.4); }
        }

        .menorah-bar {
            width: 100%;
            height: 26px;
            background: linear-gradient(180deg, #ffe08a, var(--accent-gold) 55%, #d99a16);
            border-radius: 13px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.4);
        }

        .menorah-stem {
            width: 22px;
            height: 60px;
            background: linear-gradient(90deg, #d99a16, var(--accent-gold) 50%, #d99a16);
        }

        .menorah-base {
            width: 150px;
            height: 32px;
            background: linear-gradient(180deg, #ffe08a, var(--accent-gold) 55%, #d99a16);
            border-radius: 50%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.45);
        }

        .menorah.blurred {
            filter: blur(10px);
            opacity: 0.5;
        }

        /* הודעת ניצחון */
        .win-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ffdd57, #ff9f43);
            padding: 30px;
            border-radius: 15px;
            color: var(--main-blue);
            font-size: 32px;
            text-align: center;
            z-index: 1000;
            width: 60%;
            max-width: 400px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1001;
        }

        /* כפתורים */
        .restart-button {
            position: relative;
            margin: 10px 6px;
            padding: 15px 30px;
            background: linear-gradient(45deg, #ffc13b, #ff6b6b);
            color: var(--main-blue);
            border: none;
            border-radius: 50px;
            font-size: 24px;
            font-weight: bold;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .restart-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: all 0.6s ease;
        }

        .restart-button:hover::before {
            left: 100%;
        }

        .restart-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            background: linear-gradient(45deg, #ffdd57, #ff7f50);
        }

        .restart-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        @keyframes sparkle {
            0%, 100% { text-shadow: none; }
            50% { text-shadow: 0 0 10px rgba(255,255,255,0.7); }
        }

        .restart-button span {
            display: inline-block;
            animation: sparkle 1.5s infinite;
        }

        .buttons-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }

        /* קישים מרחפים לקישוט */
        .decoration {
            position: fixed;
            font-size: 44px;
            opacity: 0.25;
            pointer-events: none;
            animation: float 5s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50% { transform: translateY(-25px) rotate(6deg); }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
                font-size: 16px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 18px;
            }

            .score {
                font-size: 22px;
            }

            .candle {
                width: 38px;
                height: 105px;
            }

            .candle-slot.shamash .candle {
                height: 140px;
            }

            .candles-row {
                gap: 8px;
            }

            .flame {
                width: 20px;
                height: 32px;
            }

            .win-message {
                width: 90%;
                font-size: 22px;
            }

            .restart-button {
                font-size: 18px;
                padding: 12px 22px;
            }

            .decoration {
                font-size: 32px;
            }
        }

        @media (max-width: 480px) {
            .candle {
                width: 28px;
                height: 82px;
            }

            .candle-slot.shamash .candle {
                height: 108px;
            }

            .candles-row {
                gap: 5px;
                padding: 0 4px;
            }

            .candle-slot {
                padding: 10px 2px;
            }

            .flame {
                width: 16px;
                height: 26px;
            }

            .menorah-base {
                width: 110px;
                height: 26px;
            }
        }
    </style>
</head>
<body>
    <span class="decoration" style="top: 12%; right: 6%;">🍩</span>
    <span class="decoration" style="top: 55%; right: 3%; animation-delay: 1.2s;">⭐</span>
    <span class="decoration" style="top: 20%; left: 6%; animation-delay: 0.6s;">🪙</span>
    <span class="decoration" style="top: 65%; left: 4%; animation-delay: 1.8s;">🕎</span>

    <h1>משחק הדלקת נרות</h1>
    <div class="subtitle">געו בנרות ותדליקו את כולם! 🕯️</div>
    <div class="score">נרות: <span id="score">0</span>/9</div>

    <div class="menorah" id="menorah">
        <div class="candles-row" id="candlesRow">
            <!-- הנרות יוצגו כאן -->
        </div>
        <div class="menorah-bar"></div>
        <div class="menorah-stem"></div>
        <div class="menorah-base"></div>
    </div>

    <div class="win-message" id="winMessage">
        חג חנוכה שמח! הדלקתם את כל הנרות! כל הכבוד! 🎉🕎
        <br>
        <button class="restart-button" onclick="restartGame()">
            <span>התחל מחדש</span>
        </button>
    </div>

    <div class="buttons-row">
        <button class="restart-button" onclick="restartGame()">
            <span>התחל מחדש</span>
        </button>
        <button class="restart-button" onclick="window.location.href='index.html'">
            <span>למשחק התאמת תמונות</span>
        </button>
        <button class="restart-button" onclick="window.location.href='משחק זיכרון חנוכה.html'">
            <span>למשחק הזיכרון</span>
        </button>
    </div>

    <div id="confetti" class="confetti"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        const candleColors = [
            '#ff6b6b', '#ffd93d', '#6bcbef', '#ff9ff3',
            '#fff3b0', // שמש
            '#54e0c7', '#feca57', '#a29bfe', '#ff8e53'
        ];
        const SHAMASH_INDEX = 4;
        const TOTAL_CANDLES = candleColors.length;

        let litCount = 0;

        function initializeGame() {
            const row = document.getElementById('candlesRow');
            row.innerHTML = '';

            candleColors.forEach((color, index) => {
                const slot = document.createElement('button');
                slot.className = 'candle-slot' + (index === SHAMASH_INDEX ? ' shamash' : '');
                slot.type = 'button';
                slot.setAttribute('aria-label', index === SHAMASH_INDEX ? 'נר שמש' : 'נר מספר ' + (index + 1));

                const flame = document.createElement('span');
                flame.className = 'flame';

                const wick = document.createElement('span');
                wick.className = 'wick';

                const candle = document.createElement('span');
                candle.className = 'candle';
                candle.style.setProperty('--candle-color', color);

                slot.appendChild(flame);
                slot.appendChild(wick);
                slot.appendChild(candle);

                slot.addEventListener('click', () => lightCandle(slot));

                row.appendChild(slot);
            });
        }

        function lightCandle(slot) {
            if (slot.classList.contains('lit')) {
                return;
            }

            slot.classList.add('lit');
            litCount++;
            document.getElementById('score').textContent = litCount;

            const spark = document.createElement('span');
            spark.className = 'spark';
            spark.textContent = '⭐';
            slot.appendChild(spark);
            setTimeout(() => spark.remove(), 1000);

            if (litCount === TOTAL_CANDLES) {
                setTimeout(triggerWinAnimation, 600);
            }
        }

        function triggerWinAnimation() {
            const winMessage = document.getElementById('winMessage');
            winMessage.style.display = 'block';
            document.getElementById('menorah').classList.add('blurred');

            if (typeof confetti === 'function') {
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1002 };
                confetti(Object.assign({}, defaults, { particleCount: 80, origin: { x: 0.2, y: 0.6 } }));
                confetti(Object.assign({}, defaults, { particleCount: 80, origin: { x: 0.8, y: 0.6 } }));
                setTimeout(() => confetti(Object.assign({}, defaults, { particleCount: 120, origin: { x: 0.5, y: 0.4 } })), 250);
            }
        }

        function restartGame() {
            litCount = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('winMessage').style.display = 'none';
            document.getElementById('menorah').classList.remove('blurred');
            initializeGame();
        }

        initializeGame();
    </script>
</body>
</html>
